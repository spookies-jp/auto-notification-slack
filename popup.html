<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Notifier Slack</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="tabs" role="tablist" aria-label="Tabs">
      <button
        id="tab-send"
        class="tab is-active"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="panel-send"
      >
        送信
      </button>
      <button
        id="tab-settings"
        class="tab"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="panel-settings"
      >
        設定
      </button>
    </header>

    <main class="container">
      <section id="panel-send" class="panel is-active" role="tabpanel" aria-labelledby="tab-send">
        <div class="row">
          <div class="label">送信先</div>
          <div id="destination" class="value">-</div>
        </div>

        <div class="row">
          <div class="label">URL</div>
          <div id="current-url" class="value url">-</div>
        </div>

        <label class="label-block" for="message">メッセージ（任意）</label>
        <textarea
          id="message"
          class="textarea"
          rows="3"
          placeholder="@here\n一言コメントなど"
        ></textarea>

        <button id="send" class="button primary" type="button">Slackへ送信</button>

        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>

      <section
        id="panel-settings"
        class="panel"
        role="tabpanel"
        aria-labelledby="tab-settings"
      >
        <label class="label-block" for="destination-select">送信先（切り替え）</label>
        <select id="destination-select" class="select"></select>

        <div class="grid">
          <div>
            <label class="label-block" for="destination-name">名前</label>
            <input id="destination-name" class="input" type="text" placeholder="例: Dev / Prod" />
          </div>
          <div>
            <label class="label-block" for="worker-url">Worker URL</label>
            <input
              id="worker-url"
              class="input"
              type="url"
              placeholder="https://xxxx.workers.dev"
            />
          </div>
        </div>

        <button id="open-access-login" class="button" type="button">
          Cloudflare Access にログイン
        </button>

        <label class="label-block" for="channel-select">Channel</label>
        <div class="row-inline">
          <select id="channel-select" class="select"></select>
          <button id="load-channels" class="button" type="button">再読込</button>
        </div>

        <div class="buttons">
          <button id="new-destination" class="button" type="button">新規</button>
          <button id="save-destination" class="button primary" type="button">保存</button>
          <button id="delete-destination" class="button danger" type="button">削除</button>
        </div>

        <div class="hint">
          先に Cloudflare Access にログインしてから、Channel を再読込して選択してください。設定はブラウザに永続化されます。
        </div>
      </section>
    </main>

    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
